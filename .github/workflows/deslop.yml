name: Deslop Architectural CI & Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  architectural-gate:
    name: Deslop Slop & Cycle Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Deslop
        run: cargo build --release

      - name: Run Test Suite
        run: cargo test --workspace

      # Threshold set at 10 (current score: ~1.0 on crates/ after resolver fixes).
      # Scans crates/ only — tests/fixtures intentionally contains cyclic code for test coverage.
      - name: Run Deslop Quality Gate (Max Slop 10)
        run: ./target/release/deslop check crates/ --max-slop 10.0

      - name: Git Churn & Temporal Coupling Analysis
        run: ./target/release/deslop churn . --commits 100

      - name: De-Looping Loop Verification
        run: ./target/release/deslop deloop crates/

      - name: Export SCIP Code Intelligence
        run: ./target/release/deslop scip crates/ -o index.scip.json

      - name: Deep Coupling & Main Sequence Analysis
        run: ./target/release/deslop deep crates/
