services:
  deslop:
    build:
      context: .
      dockerfile: Dockerfile
    image: deslop:latest
    volumes:
      - .:/workspace
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    command: ["scan", "/workspace"]
